[project]
name = "openpi"
version = "0.1.0"
description = "SeeQ: generalist value functions for long-horizon robotic manipulation (built on openpi)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "augmax>=0.3.4",
    "beartype==0.19.0",
    "distrax>=0.1.5",
    "dm-tree>=0.1.9",
    "einops>=0.8.0",
    "equinox>=0.11.8",
    "etils[epath]>=1.9.0",
    "filelock>=3.16.1",
    "flax==0.10.2",
    "fsspec[gcs]>=2024.6.0",
    "huggingface_hub>=0.34.0",
    "imageio[ffmpeg]>=2.36.1",
    "jax[cuda12]==0.5.3; sys_platform == 'linux'",
    "jax==0.5.3; sys_platform == 'darwin'",
    "jaxtyping==0.2.36",
    "matplotlib>=3.10.0",
    "mujoco==3.1.6",
    "numpy>=1.22.4,<2.0.0",
    "numpydantic>=1.6.6",
    "openpi-client",
    "optax>=0.2.4",
    "orbax-checkpoint==0.11.13",
    "pillow>=11.0.0",
    "polars>=1.30.0",
    "rich>=14.0.0",
    "scipy>=1.13.0",
    "sentencepiece>=0.2.0",
    "tqdm-loggable>=0.2",
    "typing-extensions>=4.12.2",
    "tyro>=0.9.5",
    "wandb[media]>=0.19.1",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12]==0.5.3; sys_platform == 'linux'",
]
tpu = [
    "jax[tpu]==0.5.3; sys_platform == 'linux'",
    "libtpu==0.0.11.4; sys_platform == 'linux'",
]
# Only scripts/convert_torchvision_resnet50.py needs PyTorch (to read the torchvision weights).
convert = [
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
    "pre-commit>=4.0.1",
]
# TensorFlow-CPU only ships Linux wheels; the RLDS data pipeline (training, caching,
# evaluation) therefore needs a Linux host. The models, tests and the policy server run
# without it.
rlds = [
    "dlimp; sys_platform == 'linux'",
    "tensorflow-cpu==2.15.0; sys_platform == 'linux'",
    "tensorflow-datasets==4.9.9; sys_platform == 'linux'",
]

[tool.uv]
override-dependencies = ["ml-dtypes==0.4.1", "tensorstore==0.1.74", "tensorflow-probability==0.23.0"]
dependency-metadata = [
    { name = "dlimp", version = "0.0.1", requires-dist = ["tensorflow-cpu==2.15.0", "tensorflow-datasets>=4.9.2"] },
]
# Allow resolving for macOS (without CUDA) and Linux
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
find-links = ["https://storage.googleapis.com/jax-releases/libtpu_releases.html"]
prerelease = "allow"
conflicts = [
    [
        { extra = "tpu" },
        { extra = "gpu" },
    ],
]

[tool.uv.sources]
openpi-client = { workspace = true }
dlimp = { git = "https://github.com/maxsobolmark/dlimp" }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/openpi/training/yam_fk_vendor"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FBT",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PD",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR1",
    "PLR5",
    "PLW",
    "PT",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "UP",
    "W",
]
ignore = [
    "F722",   # Conflicts with array typing.
    "T201",   # We use print statements.
    "PD008",  # Lots of false positives.
    "ISC001", # Disabling to support ruff format.
    "LOG015", # Use logger.info.
]
unfixable = [
    "B905", # Fix defaults to strict=False, which is not what we want.
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing", "typing_extensions"]
known-third-party = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
markers = ["manual: should be run manually."]
testpaths = ["src", "scripts", "packages"]
